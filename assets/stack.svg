<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="242" viewBox="0 0 1200 242" role="img" aria-label="Tech Arsenal: Python, Kotlin, Rust, C / C++, Bash, Jetpack Compose, Ollama, llama.cpp, PyTorch, ROCm, AOSP, Magisk, FastAPI, SQLite, Docker, Arch Linux, systemd, GitHub Actions">
